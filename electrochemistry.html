<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Minimalist Newton's Cradle</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border-color: rgba(56, 189, 248, 0.2);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-overlay {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      width: 90%;
      max-width: 380px;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
      margin-bottom: 0.05rem;
    }

    p {
      font-size: 0.6rem;
      color: var(--text-sub);
    }

    .info-panel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: calc(100% - 24px);
      max-width: 300px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 0.7rem;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 10;
      pointer-events: auto;
      max-height: 38vh;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .info-panel {
        left: auto;
        right: 20px;
        top: 20px;
        bottom: auto;
        max-width: 280px;
        max-height: none;
      }
      .ui-overlay {
        top: 20px;
        max-width: 450px;
      }
    }

    .info-panel h2 {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group {
      margin-bottom: 0.4rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-sub);
      margin-bottom: 0.15rem;
    }

    .control-group label span {
      color: var(--text-main);
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #374151;
      border-radius: 2px;
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .stats-box {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.4rem;
    }

    .stats-box ul {
      list-style: none;
      font-size: 0.65rem;
      color: var(--text-sub);
      line-height: 1.3;
    }

    .stats-box span {
      color: var(--text-main);
      font-weight: 600;
      float: right;
    }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <h1>Neon Physics Lab</h1>
    <p>Drag any orb to launch • Robust 2D Collision Physics</p>
  </div>

  <div class="info-panel">
    <h2>Parameters</h2>
    
    <div class="control-group">
      <label>Gravity (g): <span id="valGravity">9.81</span> m/s²</label>
      <input type="range" id="rangeGravity" min="1" max="25" step="0.5" value="9.81">
    </div>

    <div class="control-group">
      <label>Damping: <span id="valDamping">0.9999</span></label>
      <input type="range" id="rangeDamping" min="0.990" max="1.000" step="0.0001" value="0.9999">
    </div>

    <div class="control-group">
      <label>Mass (m): <span id="valMass">1.0</span> kg</label>
      <input type="range" id="rangeMass" min="0.2" max="5.0" step="0.1" value="1.0">
    </div>

    <div class="stats-box">
      <h2>Telemetry</h2>
      <ul>
        <li>State: <span id="sysState">Running</span></li>
        <li>Active: <span id="activeCount">1 Orb</span></li>
        <li>KE: <span id="calcKE">0.00 J</span></li>
        <li>PE: <span id="calcPE">0.00 J</span></li>
      </ul>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="c2d"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c2d');
    const ctx = canvas.getContext('2d');

    const sysState = document.getElementById('sysState');
    const activeCount = document.getElementById('activeCount');
    const calcKE = document.getElementById('calcKE');
    const calcPE = document.getElementById('calcPE');

    const rangeGravity = document.getElementById('rangeGravity');
    const valGravity = document.getElementById('valGravity');
    const rangeDamping = document.getElementById('rangeDamping');
    const valDamping = document.getElementById('valDamping');
    const rangeMass = document.getElementById('rangeMass');
    const valMass = document.getElementById('valMass');

    let userGravity = 9.81;
    let userDamping = 0.9999;
    let userMass = 1.0;

    rangeGravity.addEventListener('input', (e) => {
      userGravity = parseFloat(e.target.value);
      valGravity.innerText = userGravity.toFixed(1);
    });

    rangeDamping.addEventListener('input', (e) => {
      userDamping = parseFloat(e.target.value);
      valDamping.innerText = userDamping.toFixed(4);
    });

    rangeMass.addEventListener('input', (e) => {
      userMass = parseFloat(e.target.value);
      valMass.innerText = userMass.toFixed(1);
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const numBalls = 5;
    const radius = 22;
    const stringLength = 190;
    
    const balls = [];
    for (let i = 0; i < numBalls; i++) {
      balls.push({
        id: i,
        angle: i === 0 ? Math.PI / 3 : 0,
        v: 0,
        radius: radius
      });
    }

    let isDragging = false;
    let selectedBall = null;

    function getOriginX() {
      return canvas.width / 2;
    }
    function getOriginY() {
      return canvas.height * 0.32;
    }

    function getPointerPos(e) {
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      return { x: clientX, y: clientY };
    }

    function handleDown(e) {
      const pos = getPointerPos(e);
      if (!pos) return;
      
      const originX = getOriginX();
      const originY = getOriginY();
      const spacing = radius * 2;

      for (let i = 0; i < numBalls; i++) {
        let b = balls[i];
        let pivotX = originX + (i * spacing - ((numBalls - 1) * spacing) / 2);
        let bx = pivotX + Math.sin(b.angle) * stringLength;
        let by = originY + Math.cos(b.angle) * stringLength;

        let dist = Math.hypot(pos.x - bx, pos.y - by);
        if (dist < radius * 2.2) {
          selectedBall = b;
          isDragging = true;
          sysState.innerText = "Dragging";
          break;
        }
      }
    }

    function handleMove(e) {
      if (!isDragging || !selectedBall) return;
      const pos = getPointerPos(e);
      if (!pos) return;

      const originX = getOriginX();
      const originY = getOriginY();
      const spacing = radius * 2;
      
      let pivotX = originX + (selectedBall.id * spacing - ((numBalls - 1) * spacing) / 2);
      let dx = pos.x - pivotX;
      let dy = pos.y - originY;

      let newAngle = Math.atan2(dx, dy);
      selectedBall.angle = Math.max(-1.4, Math.min(1.4, newAngle));
      selectedBall.v = 0;
    }

    function handleUp() {
      if (isDragging) {
        isDragging = false;
        selectedBall = null;
        sysState.innerText = "Running";
      }
    }

    window.addEventListener('pointerdown', handleDown);
    window.addEventListener('pointermove', handleMove);
    window.addEventListener('pointerup', handleUp);

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const originX = getOriginX();
      const originY = getOriginY();
      const spacing = radius * 2;

      const subSteps = 30;
      const subDt = 0.016 / subSteps;

      if (!isDragging) {
        for (let step = 0; step < subSteps; step++) {
          for (let i = 0; i < numBalls; i++) {
            let b = balls[i];
            let a = -(userGravity / (stringLength / 100)) * Math.sin(b.angle);
            b.v += a * subDt;
            b.v *= userDamping;
            b.angle += b.v * subDt;
          }

          // Accurate 2D World Position & Collision Resolution
          let coords = [];
          for (let i = 0; i < numBalls; i++) {
            let b = balls[i];
            let pivotX = originX + (i * spacing - ((numBalls - 1) * spacing) / 2);
            let pivotY = originY;
            coords.push({
              x: pivotX + Math.sin(b.angle) * stringLength,
              y: pivotY + Math.cos(b.angle) * stringLength
            });
          }

          for (let i = 0; i < numBalls - 1; i++) {
            let b1 = balls[i];
            let b2 = balls[i+1];
            let p1 = coords[i];
            let p2 = coords[i+1];

            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let distance = Math.hypot(dx, dy);
            let minDist = radius * 2;

            if (distance < minDist) {
              // Swap angular velocities properly based on momentum transfer
              let tempV = b1.v;
              b1.v = b2.v;
              b2.v = tempV;

              // Positional push-apart to eliminate overlap glitches
              let overlap = (minDist - distance) * 0.5;
              if (distance > 0) {
                let nx = dx / distance;
                let ny = dy / distance;
                b1.angle -= (nx * overlap) / (stringLength / 100);
                b2.angle += (nx * overlap) / (stringLength / 100);
              }
            }
          }
        }
      }

      // Neon Track / Rail Bar
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#38bdf8";
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      let frameW = (numBalls * spacing) + 50;
      ctx.moveTo(originX - frameW/2, originY);
      ctx.lineTo(originX + frameW/2, originY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      let totalKE = 0;
      let totalPE = 0;
      let movingCount = 0;

      for (let i = 0; i < numBalls; i++) {
        let b = balls[i];
        let pivotX = originX + (i * spacing - ((numBalls - 1) * spacing) / 2);
        let pivotY = originY;

        let bx = pivotX + Math.sin(b.angle) * stringLength;
        let by = pivotY + Math.cos(b.angle) * stringLength;

        // Glowing String
        ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pivotX, pivotY);
        ctx.lineTo(bx, by);
        ctx.stroke();

        // Neon Orb Glow & Gradient
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#38bdf8";

        const grad = ctx.createRadialGradient(bx - 6, by - 6, 2, bx, by, radius);
        grad.addColorStop(0, "#bae6fd");
        grad.addColorStop(0.4, "#38bdf8");
        grad.addColorStop(1, "#0369a1");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#e0f2fe";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        let h = (stringLength / 100) * (1 - Math.cos(b.angle));
        let linearVel = b.v * (stringLength / 100);

        totalKE += 0.5 * userMass * (linearVel * linearVel);
        totalPE += userMass * userGravity * h;

        if (Math.abs(b.angle) > 0.02 || Math.abs(b.v) > 0.05) {
          movingCount++;
        }
      }

      calcKE.innerText = totalKE.toFixed(2) + " J";
      calcPE.innerText = totalPE.toFixed(2) + " J";
      activeCount.innerText = movingCount > 0 ? `${movingCount} Orb${movingCount > 1 ? 's' : ''}` : "At Rest";

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
