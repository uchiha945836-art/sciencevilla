<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interactive Physics-Engine Newton's Cradle</title>
  <style>
    :root {
      --bg-dark: #03050a;
      --card-bg: rgba(13, 22, 38, 0.95);
      --border-color: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 10;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.1rem;
    }

    p {
      font-size: 0.65rem;
      color: var(--text-sub);
    }

    /* Collapsible or compact mobile info panel */
    .info-panel {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: calc(100% - 20px);
      max-width: 320px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.8rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 10;
      pointer-events: auto;
      max-height: 40vh;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .info-panel {
        left: auto;
        right: 20px;
        top: 20px;
        bottom: auto;
        max-width: 300px;
        max-height: none;
      }
      .ui-overlay {
        top: 20px;
        max-width: 500px;
      }
    }

    .info-panel h2 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.3rem;
    }

    .control-group {
      margin-bottom: 0.5rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-bottom: 0.2rem;
    }

    .control-group label span {
      color: var(--text-main);
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .stats-box {
      margin-top: 0.6rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.5rem;
    }

    .stats-box ul {
      list-style: none;
      font-size: 0.7rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .stats-box span {
      color: var(--text-main);
      font-weight: 600;
      float: right;
    }

    .control-hint {
      display: none;
    }
  </style>
</head>
<body>

  <div class="ui-overlay">
    <h1>Newton's Cradle Physics Lab</h1>
    <p>Drag any ball to pull & release • Adjust metrics below</p>
  </div>

  <div class="info-panel">
    <h2>Physics Adjustments</h2>
    
    <div class="control-group">
      <label>Gravity ($g$): <span id="valGravity">9.81</span> m/s²</label>
      <input type="range" id="rangeGravity" min="1" max="25" step="0.5" value="9.81">
    </div>

    <div class="control-group">
      <label>Damping: <span id="valDamping">0.9998</span></label>
      <input type="range" id="rangeDamping" min="0.990" max="1.000" step="0.0001" value="0.9998">
    </div>

    <div class="control-group">
      <label>Mass ($m$): <span id="valMass">1.0</span> kg</label>
      <input type="range" id="rangeMass" min="0.2" max="5.0" step="0.1" value="1.0">
    </div>

    <div class="stats-box">
      <h2>Live Telemetry</h2>
      <ul>
        <li>State: <span id="sysState">Running</span></li>
        <li>Active: <span id="activeCount">1 Ball</span></li>
        <li>KE: <span id="calcKE">0.00 J</span></li>
        <li>PE: <span id="calcPE">0.00 J</span></li>
      </ul>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    const container = document.getElementById('canvas-container');
    const sysState = document.getElementById('sysState');
    const activeCount = document.getElementById('activeCount');
    const calcKE = document.getElementById('calcKE');
    const calcPE = document.getElementById('calcPE');

    const rangeGravity = document.getElementById('rangeGravity');
    const valGravity = document.getElementById('valGravity');
    const rangeDamping = document.getElementById('rangeDamping');
    const valDamping = document.getElementById('valDamping');
    const rangeMass = document.getElementById('rangeMass');
    const valMass = document.getElementById('valMass');

    let userGravity = 9.81;
    let userDamping = 0.9998;
    let userMass = 1.0;

    rangeGravity.addEventListener('input', (e) => {
      userGravity = parseFloat(e.target.value);
      valGravity.innerText = userGravity.toFixed(1);
    });

    rangeDamping.addEventListener('input', (e) => {
      userDamping = parseFloat(e.target.value);
      valDamping.innerText = userDamping.toFixed(4);
    });

    rangeMass.addEventListener('input', (e) => {
      userMass = parseFloat(e.target.value);
      valMass.innerText = userMass.toFixed(1);
    });

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x03050a, 0.02);

    // Dynamic camera positioning optimized for mobile viewports
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    function updateCameraPosition() {
      if (window.innerWidth < 768) {
        camera.position.set(0, 0.2, 10.5); // Pull back further on mobile screens
      } else {
        camera.position.set(0, 0.4, 8.5);
      }
    }
    updateCameraPosition();

    const renderer = new THREE.WebGLRenderer({ antialias: window.innerWidth > 768 }); // Disable heavy antialiasing on low-end mobiles to prevent lag
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Capped pixel ratio for performance
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap; // Lighter shadow mapping
    container.appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(6, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024; // Reduced shadow map size for performance
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const blueLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
    blueLight.position.set(-6, 4, -4);
    scene.add(blueLight);

    // Floor & Base
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x010204, roughness: 0.2, metalness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.5;
    floor.receiveShadow = true;
    scene.add(floor);

    const baseGeo = new THREE.BoxGeometry(4.6, 0.25, 2.2);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x140c08, roughness: 0.4, metalness: 0.1 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = -2.0;
    base.castShadow = true;
    base.receiveShadow = true;
    scene.add(base);

    // Frame Pillars & Top Bars
    const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 3.4, 16); // Lower geometry detail for performance
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95, roughness: 0.05 });

    [-1.9, 1.9].forEach(x => {
      [-0.8, 0.8].forEach(z => {
        const post = new THREE.Mesh(postGeo, frameMat);
        post.position.set(x, -0.2, z);
        post.castShadow = true;
        scene.add(post);
      });
    });

    const topBarGeo = new THREE.CylinderGeometry(0.04, 0.04, 3.8, 16);
    [-0.8, 0.8].forEach(z => {
      const topBar = new THREE.Mesh(topBarGeo, frameMat);
      topBar.rotation.z = Math.PI / 2;
      topBar.position.set(0, 1.5, z);
      topBar.castShadow = true;
      scene.add(topBar);
    });

    // Balls Setup (Optimized segment count from 64 to 32 for mobile performance)
    const numBalls = 5;
    const radius = 0.35;
    const stringLength = 2.7;
    const spacing = radius * 2;
    const startX = -((numBalls - 1) * spacing) / 2;

    const balls = [];
    const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ 
      color: 0xffffff, 
      metalness: 1.0, 
      roughness: 0.02
    });
    const lineMat = new THREE.LineBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.5 });

    for (let i = 0; i < numBalls; i++) {
      const ballX = startX + i * spacing;
      
      const pivot = new THREE.Group();
      pivot.position.set(ballX, 1.5, 0);
      scene.add(pivot);

      const ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, -stringLength, 0);
      ball.castShadow = true;
      ball.receiveShadow = true;
      pivot.add(ball);

      const geomFront = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.8),
        new THREE.Vector3(0, -stringLength, 0)
      ]);
      const geomBack = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0.8),
        new THREE.Vector3(0, -stringLength, 0)
      ]);

      pivot.add(new THREE.Line(geomFront, lineMat));
      pivot.add(new THREE.Line(geomBack, lineMat));

      balls.push({
        id: i,
        pivot: pivot,
        mesh: ball,
        angle: 0,
        v: 0,
        originalX: ballX,
        radius: radius
      });
    }

    balls[0].angle = Math.PI / 3;

    // Mouse & Touch Interaction Logic
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let isDragging = false;
    let selectedBall = null;

    function handlePointerDown(clientX, clientY) {
      if (clientY > window.innerHeight - 200 && clientX < 350) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(balls.map(b => b.mesh));

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        selectedBall = balls.find(b => b.mesh === clickedMesh);
        isDragging = true;
        sysState.innerText = "Dragging";
      }
    }

    function handlePointerMove(clientX, clientY) {
      if (!isDragging || !selectedBall) return;

      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const targetPos = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, targetPos);

      const dx = targetPos.x - selectedBall.originalX;
      let newAngle = Math.asin(Math.max(-1, Math.min(1, dx / stringLength)));
      
      selectedBall.angle = Math.max(-1.4, Math.min(1.4, newAngle));
      selectedBall.v = 0;
    }

    window.addEventListener('pointerdown', (e) => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('pointermove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('pointerup', () => {
      if (isDragging) {
        isDragging = false;
        selectedBall = null;
        sysState.innerText = "Running";
      }
    });

    // Physics Engine Loop
    const L = stringLength;

    function animate() {
      requestAnimationFrame(animate);

      const subSteps = 20; // Optimized sub-steps for mobile performance
      const subDt = 0.016 / subSteps;

      if (!isDragging) {
        for (let step = 0; step < subSteps; step++) {
          for (let i = 0; i < numBalls; i++) {
            let b = balls[i];
            let a = -(userGravity / L) * Math.sin(b.angle);
            b.v += a * subDt;
            b.v *= userDamping;
            b.angle += b.v * subDt;
          }

          for (let i = 0; i < numBalls - 1; i++) {
            let b1 = balls[i];
            let b2 = balls[i+1];

            let x1 = b1.originalX + L * Math.sin(b1.angle);
            let x2 = b2.originalX + L * Math.sin(b2.angle);
            let distance = x2 - x1;
            let minDist = spacing;

            if (distance < minDist) {
               let tempV = b1.v;
               b1.v = b2.v;
               b2.v = tempV;

               let overlap = (minDist - distance) * 0.5;
               b1.angle -= overlap / L;
               b2.angle += overlap / L;
            }
          }
        }
      }

      for (let i = 0; i < numBalls; i++) {
        balls[i].pivot.rotation.z = balls[i].angle;
      }

      let totalKE = 0;
      let totalPE = 0;
      let movingCount = 0;

      for (let i = 0; i < numBalls; i++) {
        let b = balls[i];
        let h = L * (1 - Math.cos(b.angle));
        let linearVel = b.v * L;

        totalKE += 0.5 * userMass * (linearVel * linearVel);
        totalPE += userMass * userGravity * h;

        if (Math.abs(b.angle) > 0.02 || Math.abs(b.v) > 0.05) {
          movingCount++;
        }
      }

      calcKE.innerText = totalKE.toFixed(2) + " J";
      calcPE.innerText = totalPE.toFixed(2) + " J";
      activeCount.innerText = movingCount > 0 ? `${movingCount} Ball${movingCount > 1 ? 's' : ''}` : "At Rest";

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updateCameraPosition();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
