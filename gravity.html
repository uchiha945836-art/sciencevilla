<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gravity Sandbox | Science Villa</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05070f;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    #canvas-container {
      flex: 1;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* UI Panel */
    .sidebar {
      width: 320px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 10;
      overflow-y: auto;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: #00f0ff;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .back-btn:hover { color: #00f0ff; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00f0ff;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    button {
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    button:hover {
      background: #334155;
      border-color: #00f0ff;
    }

    .instructions {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
      background: rgba(255,255,255,0.03);
      padding: 0.8rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="simCanvas"></canvas>
  </div>

  <div class="sidebar">
    <div>
      <a href="index.html" class="back-btn">&larr; Back to Villa</a>
      <h1>Gravity Sandbox</h1>
    </div>

    <div class="instructions">
      <p><strong>Click & Drag:</strong> Spawn planet with velocity vector.</p>
      <p><strong>Right Click:</strong> Move camera position.</p>
    </div>

    <div class="control-group">
      <label>Gravitational Constant (G): <span id="g-val">1000</span></label>
      <input type="range" id="g-slider" min="0" max="5000" value="1000">
    </div>

    <div class="control-group">
      <label>Spawn Mass: <span id="mass-val">10</span></label>
      <input type="range" id="mass-slider" min="1" max="500" value="10">
    </div>

    <div class="btn-grid">
      <button id="reset-btn">Reset Solar System</button>
      <button id="clear-btn">Clear All</button>
      <button id="pause-btn">Pause / Play</button>
      <button id="trail-btn">Toggle Trails</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Physics parameters
    let G = 1000;
    let spawnMass = 10;
    let isPaused = false;
    let showTrails = true;

    // Simulation Bodies
    let bodies = [];

    class Body {
      constructor(x, y, vx, vy, mass, color, isFixed = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.mass = mass;
        this.radius = Math.max(3, Math.sqrt(mass) * 1.5);
        this.color = color;
        this.isFixed = isFixed;
        this.path = [];
      }

      draw() {
        if (showTrails && this.path.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = this.color;
          ctx.globalAlpha = 0.3;
          ctx.lineWidth = 1;
          ctx.moveTo(this.path[0].x, this.path[0].y);
          for (let i = 1; i < this.path.length; i++) {
            ctx.lineTo(this.path[i].x, this.path[i].y);
          }
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update(dt) {
        if (this.isFixed) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.path.push({ x: this.x, y: this.y });
        if (this.path.length > 100) this.path.shift();
      }
    }

    function initPreset() {
      bodies = [];
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Sun
      bodies.push(new Body(cx, cy, 0, 0, 2000, '#ffcc00', true));

      // Planets (x, dist, vy, mass, color)
      const setup = [
        { dist: 80, vy: -4.8, mass: 5, color: '#a6a6a6' },   // Mercury
        { dist: 130, vy: -3.8, mass: 12, color: '#e3bb76' },  // Venus
        { dist: 190, vy: -3.2, mass: 15, color: '#4ba3e3' },  // Earth
        { dist: 260, vy: -2.7, mass: 8, color: '#e35d4b' },   // Mars
        { dist: 370, vy: -2.2, mass: 80, color: '#d39e82' }   // Jupiter
      ];

      setup.forEach(p => {
        bodies.push(new Body(cx + p.dist, cy, 0, p.vy, p.mass, p.color));
      });
    }

    // N-body Universal Gravitation calculation
    function applyGravity(dt) {
      for (let i = 0; i < bodies.length; i++) {
        for (let j = 0; j < bodies.length; j++) {
          if (i === j) continue;
          const b1 = bodies[i];
          const b2 = bodies[j];

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const distSq = dx * dx + dy * dy + 100; // Softening parameter to prevent infinity
          const dist = Math.sqrt(distSq);

          const force = (G * b1.mass * b2.mass) / distSq;
          const ax = (force * (dx / dist)) / b1.mass;
          const ay = (force * (dy / dist)) / b1.mass;

          if (!b1.isFixed) {
            b1.vx += ax * dt;
            b1.vy += ay * dt;
          }
        }
      }
    }

    // Mouse Interaction
    let dragStart = null;
    let currentMouse = null;

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        dragStart = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (dragStart) {
        currentMouse = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (dragStart && e.button === 0) {
        const vx = (dragStart.x - e.clientX) * 0.05;
        const vy = (dragStart.y - e.clientY) * 0.05;
        const color = `hsl(${Math.random() * 360}, 80%, 60%)`;
        bodies.push(new Body(dragStart.x, dragStart.y, vx, vy, spawnMass, color));
        dragStart = null;
        currentMouse = null;
      }
    });

    // Loop
    function animate() {
      ctx.fillStyle = 'rgba(5, 7, 15, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!isPaused) {
        applyGravity(0.16);
        bodies.forEach(b => b.update(0.16));
      }

      bodies.forEach(b => b.draw());

      // Velocity line preview during drag
      if (dragStart && currentMouse) {
        ctx.beginPath();
        ctx.moveTo(dragStart.x, dragStart.y);
        ctx.lineTo(currentMouse.x, currentMouse.y);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(dragStart.x, dragStart.y, Math.max(3, Math.sqrt(spawnMass) * 1.5), 0, Math.PI * 2);
        ctx.fillStyle = '#00f0ff';
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    // Event Controls
    document.getElementById('g-slider').addEventListener('input', (e) => {
      G = parseFloat(e.target.value);
      document.getElementById('g-val').textContent = G;
    });

    document.getElementById('mass-slider').addEventListener('input', (e) => {
      spawnMass = parseFloat(e.target.value);
      document.getElementById('mass-val').textContent = spawnMass;
    });

    document.getElementById('reset-btn').addEventListener('click', initPreset);
    document.getElementById('clear-btn').addEventListener('click', () => bodies = []);
    document.getElementById('pause-btn').addEventListener('click', () => isPaused = !isPaused);
    document.getElementById('trail-btn').addEventListener('click', () => showTrails = !showTrails);

    initPreset();
    animate();
  </script>
</body>
</html>
